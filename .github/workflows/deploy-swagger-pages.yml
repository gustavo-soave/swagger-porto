name: Deploy Swagger no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "swagger-site/**"
      - ".github/workflows/deploy-swagger-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar Swagger
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: swagger-site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4