openapi: 3.0.3
info:
  title: Vendeu Ganhou - Integração de estoque das viaturas
  version: 1.0.0-draft
  description: |
    Contrato proposto para consulta do estoque de baterias mantido pelos
    socorristas (QRA). Os endpoints de negócio são novos, mas usam os dados já
    existentes em `rescuers`, `battery_inventory` e `products`.

    Uma bateria está no estoque da viatura quando o holder atual é o socorrista,
    a entrega foi confirmada, a entrega não foi rejeitada e a bateria ainda não
    foi vendida.
servers:
  - url: /api/v1
    description: Prefixo versionado da API
tags:
  - name: Integration authentication
  - name: Fleet battery stock
security:
  - OAuth2ClientCredentials:
      - fleet-stock:read
paths:
  /integrations/oauth/token:
    post:
      tags: [Integration authentication]
      summary: Obter token de integração
      description: |
        Autentica a aplicação por client credentials. Envie `client_id` e
        `client_secret` por HTTP Basic e `grant_type=client_credentials` no corpo.
      security:
        - ClientCredentialsBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                scope:
                  type: string
                  example: fleet-stock:read
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /integrations/fleet-stock/qras/{qra}:
    get:
      tags: [Fleet battery stock]
      operationId: getFleetStockByQra
      summary: Consultar baterias no estoque de uma viatura por QRA
      parameters:
        - $ref: '#/components/parameters/Qra'
      responses:
        '200':
          description: QRA encontrado; `batteries` pode ser vazio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetStockByQraResponse'
              example:
                qra: QRA001
                rescuer:
                  id: 9c3405a6-cfcf-4fa4-89f7-aed13781a9d3
                  name: Joao da Silva
                totalQuantity: 3
                batteries:
                  - model:
                      id: 9c555530-2612-4fcc-b528-e9a65ca3d812
                      code: M60AD
                      name: Moura M60AD
                    quantity: 2
                    items:
                      - id: 65e2ce42-8cdb-48cf-a2d3-ceaab436da31
                        tag: BAT-000123
                      - id: ca7529d3-02d5-4ef6-af14-58da2dc34870
                        tag: BAT-000124
                  - model:
                      id: fa10ad50-9758-4e43-b385-2dddf7747f20
                      code: M50JD
                      name: Moura M50JD
                    quantity: 1
                    items:
                      - id: c482a5d7-9b6d-47df-992c-327ed18643bb
                        tag: BAT-000125
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: QRA não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrations/fleet-stock/battery-models/{modelCode}/qras:
    get:
      tags: [Fleet battery stock]
      operationId: getQrasByBatteryModel
      summary: Consultar QRAs com determinado modelo no estoque da viatura
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Modelo encontrado; `items` pode ser vazio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrasByBatteryModelResponse'
              example:
                model:
                  id: 9c555530-2612-4fcc-b528-e9a65ca3d812
                  code: M60AD
                  name: Moura M60AD
                totalQuantity: 5
                items:
                  - qra: QRA001
                    rescuerId: 9c3405a6-cfcf-4fa4-89f7-aed13781a9d3
                    rescuerName: Joao da Silva
                    quantity: 2
                  - qra: QRA017
                    rescuerId: 88b5aa5d-771c-4606-9496-967e8f13ff7c
                    rescuerName: Maria Souza
                    quantity: 3
                pagination:
                  page: 1
                  perPage: 20
                  totalItems: 2
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Modelo de bateria não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ClientCredentialsBasic:
      type: http
      scheme: basic
      description: "`client_id` como usuário e `client_secret` como senha"
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/integrations/oauth/token
          scopes:
            fleet-stock:read: Consultar estoque de baterias das viaturas

  parameters:
    Qra:
      name: qra
      in: path
      required: true
      description: Número QRA exato e único do socorrista
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: QRA001
    ModelCode:
      name: modelCode
      in: path
      required: true
      description: Código exato e único do modelo em `products.code`
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: M60AD
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Parâmetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Credencial ou token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Client sem o escopo `fleet-stock:read`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    OAuthToken:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Validade em segundos
          example: 900
        scope:
          type: string
          example: fleet-stock:read

    RescuerSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true

    BatteryModel:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
          nullable: true

    BatteryItem:
      type: object
      required: [id, tag]
      properties:
        id:
          type: string
          format: uuid
          description: "`battery_inventory.public_id`"
        tag:
          type: string
          nullable: true
          description: Etiqueta física da bateria

    BatteryStockGroup:
      type: object
      required: [model, quantity, items]
      properties:
        model:
          $ref: '#/components/schemas/BatteryModel'
        quantity:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatteryItem'

    FleetStockByQraResponse:
      type: object
      required: [qra, rescuer, totalQuantity, batteries]
      properties:
        qra:
          type: string
        rescuer:
          $ref: '#/components/schemas/RescuerSummary'
        totalQuantity:
          type: integer
          minimum: 0
        batteries:
          type: array
          items:
            $ref: '#/components/schemas/BatteryStockGroup'

    QraStockItem:
      type: object
      required: [qra, rescuerId, rescuerName, quantity]
      properties:
        qra:
          type: string
        rescuerId:
          type: string
          format: uuid
        rescuerName:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1

    Pagination:
      type: object
      required: [page, perPage, totalItems, totalPages]
      properties:
        page:
          type: integer
        perPage:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    QrasByBatteryModelResponse:
      type: object
      required: [model, totalQuantity, items, pagination]
      properties:
        model:
          $ref: '#/components/schemas/BatteryModel'
        totalQuantity:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/QraStockItem'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
